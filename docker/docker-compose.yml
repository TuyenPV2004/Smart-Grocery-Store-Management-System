services:
  db:
    image: mysql:8.0
    container_name: grocery_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_db"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  auth-db:
    image: mysql:8.0
    container_name: grocery_auth_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_auth_db"
    ports:
      - "3308:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  catalog-db:
    image: mysql:8.0
    container_name: grocery_catalog_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_catalog_db"
    ports:
      - "3309:3306"
    volumes:
      - catalog_db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  order-db:
    image: mysql:8.0
    container_name: grocery_order_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_order_db"
    ports:
      - "3310:3306"
    volumes:
      - order_db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  notification-db:
    image: mysql:8.0
    container_name: grocery_notification_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_notification_db"
    ports:
      - "3311:3306"
    volumes:
      - notification_db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  inventory-db:
    image: mysql:8.0
    container_name: grocery_inventory_db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "grocery_inventory_db"
    ports:
      - "3312:3306"
    volumes:
      - inventory_db_data:/var/lib/mysql
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: grocery_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 20s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: grocery_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/grocery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_URL=${VNPAY_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - ../backend/product-images:/app/product-images
      - ../backend/user-photos:/app/user-photos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grocery_network

  auth-service:
    build:
      context: ../auth-service
      dockerfile: ../docker/auth-service.Dockerfile
    container_name: grocery_auth_service
    ports:
      - "8081:8081"
    environment:
      - AUTH_DB_URL=jdbc:mysql://auth-db:3306/grocery_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - AUTH_DB_USERNAME=${DB_USERNAME}
      - AUTH_DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - grocery_network

  catalog-service:
    build:
      context: ../catalog-service
      dockerfile: ../docker/catalog-service.Dockerfile
    container_name: grocery_catalog_service
    ports:
      - "8082:8082"
    environment:
      - CATALOG_DB_URL=jdbc:mysql://catalog-db:3306/grocery_catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - CATALOG_DB_USERNAME=${DB_USERNAME}
      - CATALOG_DB_PASSWORD=${DB_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - grocery_network

  order-service:
    build:
      context: ../order-service
      dockerfile: ../docker/order-service.Dockerfile
    container_name: grocery_order_service
    ports:
      - "8083:8083"
    environment:
      - ORDER_DB_URL=jdbc:mysql://order-db:3306/grocery_order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - ORDER_DB_USERNAME=${DB_USERNAME}
      - ORDER_DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_URL=${VNPAY_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grocery_network

  notification-service:
    build:
      context: ../notification-service
      dockerfile: ../docker/notification-service.Dockerfile
    container_name: grocery_notification_service
    ports:
      - "8084:8084"
    environment:
      - NOTIFICATION_DB_URL=jdbc:mysql://notification-db:3306/grocery_notification_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - NOTIFICATION_DB_USERNAME=${DB_USERNAME}
      - NOTIFICATION_DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grocery_network

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: ../docker/inventory-service.Dockerfile
    container_name: grocery_inventory_service
    ports:
      - "8085:8085"
    environment:
      - INVENTORY_DB_URL=jdbc:mysql://inventory-db:3306/grocery_inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - INVENTORY_DB_USERNAME=${DB_USERNAME}
      - INVENTORY_DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      inventory-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - grocery_network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: ../docker/api-gateway.Dockerfile
    container_name: grocery_api_gateway
    ports:
      - "8088:8088"
    environment:
      - AUTH_SERVICE_URI=http://auth-service:8081
      - CATALOG_SERVICE_URI=http://catalog-service:8082
      - ORDER_SERVICE_URI=http://order-service:8083
      - NOTIFICATION_SERVICE_URI=http://notification-service:8084
      - INVENTORY_SERVICE_URI=http://inventory-service:8085
      - MONOLITH_URI=http://backend:8080
      - MONOLITH_WS_URI=ws://backend:8080
    depends_on:
      - backend
      - auth-service
      - catalog-service
      - order-service
      - notification-service
      - inventory-service
    networks:
      - grocery_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: grocery_frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - grocery_network

networks:
  grocery_network:
    driver: bridge

volumes:
  db_data:
  auth_db_data:
  catalog_db_data:
  order_db_data:
  notification_db_data:
  inventory_db_data:
