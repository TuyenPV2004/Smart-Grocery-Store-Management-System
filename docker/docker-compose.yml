services:
  mysql:
    image: mysql:8.0
    container_name: grocery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init-scripts/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: grocery_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 20s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: grocery_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
      start_period: 10s

  keycloak-db:
    image: postgres:16
    container_name: grocery_keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - grocery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      timeout: 20s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: grocery_keycloak
    command:
      - start
      - --http-port=8080
      - --http-enabled=true
      - --hostname=http://localhost:8090
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9000'"]
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - grocery_network

  discovery-server:
    build:
      context: ../infrastructure/discovery-server
      dockerfile: Dockerfile
    container_name: grocery_discovery_server
    ports:
      - "8761:8761"
    networks:
      - grocery_network

  config-server:
    build:
      context: ../infrastructure/config-server
      dockerfile: Dockerfile
    container_name: grocery_config_server
    ports:
      - "8888:8888"
    environment:
      - CONFIG_SERVER_PROFILE=native
      - CONFIG_REPO_URI=file:/config-repo
    volumes:
      - ../infrastructure/config-repo:/config-repo:ro
    depends_on:
      - discovery-server
    networks:
      - grocery_network

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: grocery_auth_service
    expose:
      - "8081"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - AUTH_DB_URL=jdbc:mysql://mysql:3306/grocery_auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - AUTH_DB_USERNAME=${DB_USERNAME}
      - AUTH_DB_PASSWORD=${DB_PASSWORD}
      - AUTH_MULTIPART_MAX_FILE_SIZE=10MB
      - AUTH_MULTIPART_MAX_REQUEST_SIZE=10MB
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - grocery_network

  catalog-service:
    build:
      context: ../services/catalog-service
      dockerfile: Dockerfile
    container_name: grocery_catalog_service
    expose:
      - "8082"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - CATALOG_DB_URL=jdbc:mysql://mysql:3306/grocery_catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - CATALOG_DB_USERNAME=${DB_USERNAME}
      - CATALOG_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - grocery_network

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    container_name: grocery_order_service
    expose:
      - "8083"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - ORDER_DB_URL=jdbc:mysql://mysql:3306/grocery_order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - ORDER_DB_USERNAME=${DB_USERNAME}
      - ORDER_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
      - INVENTORY_INTERNAL_SERVICE_TOKEN=${INVENTORY_INTERNAL_SERVICE_TOKEN:-dev-internal-inventory-token}
      - VOUCHER_SERVICE_URL=http://promotion-service:8086
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_URL=${VNPAY_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started
      promotion-service:
        condition: service_started
    networks:
      - grocery_network

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: grocery_notification_service
    expose:
      - "8084"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - NOTIFICATION_DB_URL=jdbc:mysql://mysql:3306/grocery_notification_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - NOTIFICATION_DB_USERNAME=${DB_USERNAME}
      - NOTIFICATION_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grocery_network

  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    container_name: grocery_inventory_service
    expose:
      - "8085"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - INVENTORY_DB_URL=jdbc:mysql://mysql:3306/grocery_inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - INVENTORY_DB_USERNAME=${DB_USERNAME}
      - INVENTORY_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - AUTH_SERVICE_URL=http://auth-service
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - "REDIS_LOCK_KEY_PREFIX=grocery:inventory:lock:"
      - REDIS_LOCK_WAIT_TIMEOUT=5s
      - REDIS_LOCK_RETRY_INTERVAL=50ms
      - REDIS_LOCK_LEASE_TIME=30s
      - INVENTORY_INTERNAL_SERVICE_TOKEN=${INVENTORY_INTERNAL_SERVICE_TOKEN:-dev-internal-inventory-token}
      - INVENTORY_FLYWAY_LOCATIONS=filesystem:/app/migration
    volumes:
      - ../database/migration:/app/migration:ro
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocery_network

  promotion-service:
    build:
      context: ../services/promotion-service
      dockerfile: Dockerfile
    container_name: grocery_promotion_service
    expose:
      - "8086"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - PROMOTION_DB_URL=jdbc:mysql://mysql:3306/grocery_promotion_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - PROMOTION_DB_USERNAME=${DB_USERNAME}
      - PROMOTION_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - CATALOG_SERVICE_URL=http://catalog-service:8082
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - grocery_network

  chat-service:
    build:
      context: ../services/chat-service
      dockerfile: Dockerfile
    container_name: grocery_chat_service
    expose:
      - "8087"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - CHAT_DB_URL=jdbc:mysql://mysql:3306/grocery_chat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - CHAT_DB_USERNAME=${DB_USERNAME}
      - CHAT_DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - WEBSOCKET_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - grocery_network

  api-gateway:
    build:
      context: ../infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: grocery_api_gateway
    ports:
      - "8088:8088"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
      inventory-service:
        condition: service_started
      promotion-service:
        condition: service_started
      chat-service:
        condition: service_started
    networks:
      - grocery_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL}
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    container_name: grocery_frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - grocery_network

networks:
  grocery_network:
    driver: bridge

volumes:
  mysql_data:
  keycloak_db_data:
  redis_data:
