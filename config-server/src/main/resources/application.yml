server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_URI:file:/config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: ${CONFIG_GIT_DEFAULT_LABEL:main}
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
