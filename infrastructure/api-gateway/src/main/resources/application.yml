server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/grocery}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/grocery/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - Authorization
                  - X-Trace-Id
                allow-credentials: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/suppliers/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**,/api/payment/**,/api/dashboard/**,/api/bank-accounts/**
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**,/api/batches/**,/api/stocks/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
            - id: promotion-service-vouchers
              uri: lb://PROMOTION-SERVICE
              predicates:
                - Path=/api/vouchers/**
            - id: promotion-service-promotions
              uri: lb://PROMOTION-SERVICE
              predicates:
                - Path=/api/promotions/**
            - id: chat-service-api
              uri: lb://CHAT-SERVICE
              predicates:
                - Path=/api/chat/**
            - id: chat-service-websocket
              uri: lb:ws://CHAT-SERVICE
              predicates:
                - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read_only
